<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Рефакторинг — CampusFlow для самостоятельной работы (пр2)</title>
  </head>
  <body>
    <header>
      <nav>
        --- исправлена ссылка для перехода вместо div --
        <a href="index.html">Главная</a>
      </nav>
    </header>

    <main>
      --- выполнена правильная иерархия заголовков, а именно после h1 - h2---
      <h1>Мероприятия</h1>
      <section>
        <h2>Поиск мероприятия</h2>
        <form>
          --- доступное имя поля ---
          <label for="event-search">Введите название</label>
          <input id="event-search" type="text" name="event" />
          ---исправлена кнопка для действия---
          <button type="submit">Найти</button>
        </form>
        --- добавлен осмысленный alt ---
        <img src="assets/images/search.png" alt="Иконка поиска мероприятий" />
      </section>
    </main>
  </body>
</html>
